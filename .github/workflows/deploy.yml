name: GitHub Pages'e yayınla

# Uygulama saf istemci tarafı bir PWA. Derleyip dist/ klasörünü Pages'e
# yüklüyoruz; kullanıcı yayınlanan adresi iOS'ta "Ana Ekrana Ekle" ile kurabiliyor.

on:
  push:
    branches:
      - main
      - claude/juriscalendar-legal-platform-y8f5lr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; sıradaki beklesin, çalışan iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip denetimi ve derleme
        # Pages sitesi https://<kullanici>.github.io/MYLOVE/ altında yayınlanıyor.
        env:
          BASE_PATH: /MYLOVE/
        run: npm run build

      - name: Testler
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
